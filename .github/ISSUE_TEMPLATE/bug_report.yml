name: Bug report
description: Report a reproducible problem in Brick Flow
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Import...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Project or model file
      description: Attach a minimal JSON, LDR, MPD, or OBJ file when possible. Remove anything you do not want to share.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Brick Flow version, part count, and active part pack.
    validations:
      required: true

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser workflow tests
        run: npm run test:e2e

      - name: Validate builds
        run: npm run validate:builds

      - name: Audit LDraw coverage
        run: npm run audit:ldraw

      - name: Audit OBJ connectivity
        run: npm run audit:obj-connectivity

      - name: Build
        run: npm run build

      # Informational only: shared runners vary too much for absolute ms
      # thresholds, so regressions are reviewed from the timings table.
      - name: Profile performance (informational)
        run: npm run profile:performance
        continue-on-error: true

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fast quality checks, build, and unit tests
        run: |
          npm run verify:construction-cache
          npm run audit:dependencies
          npm run lint
          npm run build
          npm test
          npm run verify:replicas
          npm run audit:ldraw
          npm run audit:obj-connectivity

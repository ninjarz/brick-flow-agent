name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Verify quality, dependency audit and built browser workflows
        run: npm run verify:quality

      - name: Profile performance (timings, not shared-runner thresholds)
        run: npm run profile:performance

      - name: Upload browser traces and performance samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results
